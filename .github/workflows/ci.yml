name: CI

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Info.plist'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Info.plist'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # The build IS the spec: if it compiles, the app's structure holds.
      # Catches regressions on every push/PR.
      - name: swift build
        run: swift build

      # Quota reader accuracy: token de-duplication, cache-token accounting,
      # local day boundary and codex rate-limit window mapping. Pure stdlib,
      # temp-dir fixtures, no network and no user data.
      - name: quota.py accuracy tests
        run: python3 Tests/quota/test_quota.py

      - name: Installer and release-notes regression tests
        run: |
          /bin/bash Tests/installer/test_install.sh
          /bin/bash Tests/release/test_release_notes.sh
          python3 Tests/release/test_update_manifest.py
          /bin/bash Tests/installer/test_source_update.sh

      # Unit + in-process UI tests (see Tests/KajiTests/UITestHarness.swift).
      # These boot the real AppDelegate/status-item/popover object graph
      # and invoke the real click-handler closure — no self-skipping.
      - name: swift test
        run: swift test

      - name: Assemble universal app bundle
        run: KAJI_UNIVERSAL=1 ./scripts/build-app.sh

      - name: Verify non-interactive ad-hoc signature
        run: |
          test "$(codesign -dv --verbose=4 dist/Kaji.app 2>&1 | sed -n 's/^Signature=//p')" = "adhoc"
          codesign --verify --deep --strict dist/Kaji.app
          lipo dist/Kaji.app/Contents/MacOS/Kaji -verify_arch arm64 x86_64
          lipo dist/Kaji.app/Contents/Library/HelperTools/KajiSleepHelper -verify_arch arm64 x86_64
