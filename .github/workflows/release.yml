name: Release

# Tag a version (e.g. `git tag v0.8.0 && git push origin v0.8.0`) to publish
# a source release with generated notes. No .app.zip — install builds from
# source (see install.sh).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
