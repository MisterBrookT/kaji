name: Release

# Tag a version (e.g. `git tag v0.6.1 && git push --tags`) to publish a
# GitHub Release. Notes come from `dev_docs/ship/releases/<tag>.md` when
# present. No .app.zip — install builds from source (see install.sh).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="dev_docs/ship/releases/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No $NOTES — falling back to generated notes"
          fi

      - name: Publish release (authored notes)
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}

      - name: Publish release (generated notes)
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
